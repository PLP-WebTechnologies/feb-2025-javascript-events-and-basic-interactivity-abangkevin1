<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abang Kevin Artwork</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to Abang Kevin Artwork</h1>
    </header>
    <main>
        <section>
            <h2>Event Handling</h2>
            <button id="changeTextButton">Click Me!</button>
            <p id="textToChange">This text will change on button click.</p>
        </section>
        <section>
            <h2>Abang Artwork</h2>
            <div id="imageGallery">
                <img src="girl.PNG" alt="girl">
                <img src="lion.PNG" alt="lion">
                <img src="lipstick.PNG" alt="lipstick">
            </div>
        </section>
        <section>
            <h2>Feedback</h2>
            <form id="userForm">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <label for="message">message:</label>
                <input type="message" id="message" minlength="8" required>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
